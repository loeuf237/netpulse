[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netpulse"
version = "1.2.0"
description = "Real-time Network Monitor, Application Firewall and TUN Proxy Routing for Linux (GNOME/Libadwaita)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "paulin" }
]
dependencies = [
    "psutil>=5.9.0",
    "PyGObject>=3.42.0",
    "pycairo>=1.20.0",
]

[project.scripts]
netpulse = "netpulse.gui:main"
netpulse-gui = "netpulse.gui:main"
netpulse-monitor = "netpulse.monitor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
script-files = ["bin/netpulse-ctl"]
