name: NetPulse CI/CD

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netpulse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  ubuntu:
    name: Ubuntu ${{ matrix.ubuntu }} (${{ matrix.coverage }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: '18.04'
            coverage: core
          - ubuntu: '22.04'
            coverage: monitor
          - ubuntu: '26.04'
            coverage: full GTK
    steps:
      # Checkout runs on the host: Node-based actions cannot run in Bionic's glibc.
      - uses: actions/checkout@v6
      - name: Test in the requested Ubuntu userspace
        run: |
          mkdir -p "$RUNNER_TEMP/ubuntu-artifacts"
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -v "$RUNNER_TEMP/ubuntu-artifacts:/artifacts" \
            ubuntu:${{ matrix.ubuntu }} bash tools/ci_ubuntu.sh '${{ matrix.ubuntu }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-${{ matrix.ubuntu }}-wheel
          path: ${{ runner.temp }}/ubuntu-artifacts/**/*.whl
          if-no-files-found: error
          retention-days: 14

  javascript:
    name: GNOME extension
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: |
          node --input-type=module --check < extension/extension.js
          node tests/test_extension.cjs
          git diff --check

  package:
    name: Release artifacts
    needs: [ubuntu, javascript]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Validate version and build packages
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python tools/release.py --tag "$RELEASE_TAG"
          else
            python tools/release.py
          fi
          python -m pip install build
          python -m build
          python tools/check_wheel.py dist/*.whl
          python tools/release.py --dist dist
          cd dist
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: netpulse-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: package
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: netpulse-release
          path: dist
      - name: Publish tested artifacts and curated notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tools/release.py --tag "$RELEASE_TAG"
          cd dist
          sha256sum -c SHA256SUMS
          cd ..
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
              --title "NetPulse ${RELEASE_TAG#v}" --notes-file "releases/$RELEASE_TAG.md"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest \
            --title "NetPulse ${RELEASE_TAG#v}" --notes-file "releases/$RELEASE_TAG.md"
